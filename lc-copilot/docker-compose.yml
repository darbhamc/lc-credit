services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lc
      POSTGRES_PASSWORD: lc
      POSTGRES_DB: lc_copilot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lc"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
